[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kpx"
version = "0.1.0"
description = "Experiment harness for the Medallion pipeline evaluation on Korean public data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Yeongseon Choe" }]

dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
]

[project.optional-dependencies]
figures = [
  "matplotlib>=3.8",
]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.5,<1",
  "pandas-stubs",
]

[project.scripts]
kpx = "kpx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kpx"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

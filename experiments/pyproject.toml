[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kpx"
version = "0.1.0"
description = "Experiment harness for the Medallion pipeline evaluation on Korean public data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Yeongseon Choe" }]

dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  # Peak RSS and host memory are measurements the harness reports, not
  # development tooling, so they ship with it.
  "psutil>=5.9",
  # Cyclomatic complexity is a measurement the harness reports, not a
  # development tool, so it ships with the harness rather than with dev.
  "radon>=6.0,<7",
]

[project.optional-dependencies]
analysis = [
  "scikit-learn>=1.4",
  "scipy>=1.11",
]
figures = [
  "matplotlib>=3.8",
]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.5,<1",
  "pandas-stubs",
  "types-psutil",
]

[project.scripts]
kpx = "kpx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kpx"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["radon.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

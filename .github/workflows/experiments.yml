name: experiments

on:
  push:
    branches: [main]
    paths: ["experiments/**", ".github/workflows/experiments.yml"]
  pull_request:
    paths: ["experiments/**", ".github/workflows/experiments.yml"]

jobs:
  check:
    # Windows is in the matrix because the snapshot digest is built from path
    # strings, and how a path is spelled differs by platform. That class of bug
    # is invisible on a single runner and breaks reproducibility for exactly the
    # readers the published artifact is for.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: experiments
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra analysis
      # scripts/ 도 검사한다. 논문의 숫자를 만드는 절차가 거기 있고, 검사하지
      # 않으면 재현 절차만 조용히 썩는다. mypy는 제외한다 — 빌드 스크립트가
      # kpubdata-builder를 import하는데 그것은 이 환경에 설치되지 않는다.
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy src
      - run: uv run pytest
      # mypy가 보지 않는 scripts/ 가 적어도 import는 되는지 본다. 빌드 스크립트의
      # kpubdata-builder import는 main() 안에 있어서 --help 까지는 도달한다.
      # PYTHONUTF8은 콘솔 인코딩 때문이다 — 도움말이 한글이라 cp949 터미널에서는
      # 인코딩 오류로 죽는다.
      - run: |
          for script in scripts/*.py; do
            case "$script" in scripts/_paths.py|*_spec.py) continue;; esac
            uv run python "$script" --help > /dev/null
          done
        shell: bash
        env:
          PYTHONUTF8: "1"
